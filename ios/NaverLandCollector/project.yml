name: NaverLandCollector
options:
  bundleIdPrefix: com.genon.naverland
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  NaverLandCollector:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 매물수집기
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genon.naverland.NaverLandCollector
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
